name: COPR build

on:
  push:
    branches:
      - master
    paths:
      - .copr/Makefile
      - .github/workflows/copr.yml
      - pycharm-community.spec
      - pycharm-community.desktop
      - pycharm-community.metainfo.xml
      - pycharm-community.xml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install build dependencies
        run: dnf --assumeyes install git python3-pip

      - uses: actions/checkout@v4

      - name: Install COPR CLI
        run: python3 -m pip install copr-cli

      - name: Configure COPR CLI
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          mkdir -p ~/.config
          chmod 700 ~/.config
          umask 077
          cat > ~/.config/copr <<EOF
          [copr-cli]
          login = $COPR_LOGIN
          username = $COPR_USERNAME
          token = $COPR_TOKEN
          copr_url = https://copr.fedorainfracloud.org
          EOF

      - name: Create COPR project if needed
        env:
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          if ! copr-cli get "$COPR_USERNAME/PyCharm" >/dev/null 2>&1; then
            copr-cli create PyCharm \
              --chroot fedora-43-x86_64 \
              --chroot fedora-44-x86_64 \
              --chroot fedora-45-x86_64 \
              --chroot fedora-rawhide-x86_64 \
              --description 'PyCharm Community Edition with patched JetBrains Runtime'
          fi

      - name: Submit COPR SCM build
        env:
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
        run: |
          copr-cli buildscm "$COPR_USERNAME/PyCharm" \
            --clone-url "https://github.com/${{ github.repository }}.git" \
            --commit "${{ github.sha }}" \
            --subdir .copr \
            --spec ../pycharm-community.spec \
            --method make_srpm \
            --enable-net on \
            --nowait \
            -r fedora-43-x86_64 \
            -r fedora-44-x86_64 \
            -r fedora-45-x86_64 \
            -r fedora-rawhide-x86_64
